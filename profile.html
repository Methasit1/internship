<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เด็กฝึกงาน.SE</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        .font-eng { font-family: 'Sarabun', 'Inter', sans-serif; }
        .font-thai { font-family: 'Sarabun', 'Kanit', sans-serif; }

            /* อนิเมชันการ์ด */
        .review-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* สถานะเมื่อกดลบ */
        .review-card.deleting {
            opacity: 0;
            transform: scale(0.95);
            max-height: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-bottom: -1rem !important; /* หักล้างระยะ gap-4 (16px) ให้สมูท */
            border-width: 0 !important;
        }
    </style>
</head>
<body class="bg-[#F3F5F7] h-screen overflow-hidden flex flex-col">

    <!-- Navigation -->
    <nav class="flex items-center justify-between px-6 py-3 bg-white border-b border-gray-100 shrink-0">
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo" class="w-28 h-auto">
        </a>
        
        <div class="relative hidden md:flex items-center gap-8 text-gray-600 font-medium" id="nav-menu">
            <a href="./index.html" class="nav-item hover:text-emerald-600 pb-1 transition-colors">Feed</a>
            <a href="./profile.html" class="nav-item text-emerald-600 pb-1 transition-colors">Profile</a>
            <div id="nav-indicator" class="absolute bottom-0 left-0 h-[2px] bg-emerald-600 transition-all duration-300 ease-out"></div>
        </div>
        
        <div class="flex items-center gap-3 ml-10">
            <a href="./login.html" id="btn-login" class="hidden bg-[#10B981] hover:bg-emerald-600 text-white px-5 py-2 rounded-full font-bold text-sm transition">
                เข้าสู่ระบบ
            </a>
            <a href="./profile.html" id="btn-profile" class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-700 shrink-0 hover:bg-gray-300 transition">
                <i class="fa-regular fa-user text-base"></i>
            </a>
            <button id="btn-logout" class="hidden text-sm text-red-500 hover:text-red-700 font-medium cursor-pointer">
                ออกจากระบบ
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-6 py-6 flex flex-col min-h-0">
        
        <!-- ปุ่มย้อนกลับ -->
        <a title="toallcompanybtn" href="./allCompany.html" class="font-thai inline-flex items-center gap-2 text-black/50 hover:text-gray-700 font-normal text-lg transition-colors mb-3 shrink-0">
            <i class="fa-solid fa-chevron-left text-lg font-extrabold"></i>
            บริษัททั้งหมด
        </a>

        <section class="flex flex-col lg:flex-row w-full gap-6 items-start flex-1 min-h-0">
            
            <!-- ฝั่งซ้าย: Profile & Contact -->
            <div class="w-full lg:w-80 shrink-0 flex flex-col gap-4">
                
                <!-- Profile Card -->
                <aside class="flex flex-col items-center bg-white w-full rounded-3xl p-5 shadow-sm border border-gray-100">
                    <img src="./img/profile.jpg" alt="profileimage" class="rounded-full w-32 h-32 object-cover shadow-sm"/>
                    <p class="text-lg font-medium font-thai mt-3 text-center">นายแฮมมี่ มหัศจรรย์</p>
                    <span class="bg-[#10B981] text-white font-thai rounded-full px-6 py-1 font-semibold text-xs tracking-wider mt-2">ฝึกงาน</span>
                </aside>

                <!-- Contact Information Card -->
                <aside class="flex flex-col bg-white w-full rounded-3xl p-5 shadow-sm border border-gray-100 gap-3">
                    <h1 class="text-base font-semibold font-eng border-b border-gray-100 pb-2">CONTACT INFORMATION</h1>
                    
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-[#A3F3D1] text-[#0B5C43] flex items-center justify-center shrink-0">
                            <i class="fa-regular fa-envelope text-sm"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs font-semibold text-gray-800">Email Address</p>
                            <p class="text-xs text-gray-500 truncate">a.mercer@up.ac.th</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 rounded-full bg-[#A3F3D1] text-[#0B5C43] flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-link text-sm"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-xs font-semibold text-gray-800">LinkedIn Profile</p>
                                <a href="#" class="text-xs text-gray-500 hover:text-[#00B98B] truncate block">linkedin.com/in/alexmercer</a>
                            </div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-gray-400 text-sm shrink-0"></i>
                    </div>

                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 rounded-full bg-[#A3F3D1] text-[#0B5C43] flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-globe text-sm"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="text-xs font-semibold text-gray-800">Facebook</p>
                                <a href="#" class="text-xs text-gray-500 hover:text-[#00B98B] truncate block">facebook.com/alex.m</a>
                            </div>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-gray-400 text-sm shrink-0"></i>
                    </div>    
                </aside>
            </div>

            <!-- ฝั่งขวา: My Reviews -->
            <div class="flex-1 min-w-0 flex flex-col h-full">
                <h2 class="text-xl font-eng font-bold text-gray-900 mb-3 shrink-0">My Reviews</h2>
                
                <!-- Container สำหรับรายการการ์ด พร้อม Scrollbar นุ่มนวลถ้าเกินพื้นที่ -->
                <div id="profileReviewContainer" class="flex flex-col gap-4 overflow-y-auto pr-1 flex-1">
                </div>
            </div>

        </section>
    </main>

    <!-- นำเข้า TypeScript ที่คอมไพล์แล้ว -->
    <script type="module" src="./js/profile.js"></script>
</body>
</html>>
