<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เด็กฝึกงาน.SE</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        .font-eng { font-family: 'Sarabun', 'Inter', sans-serif; }
        .font-thai { font-family: 'Sarabun', 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-[#F3F5F7] min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="flex items-center justify-between px-6 py-3 bg-white border-b border-gray-100 shrink-0">
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo" class="w-28 h-auto">
        </a>
        
        <div class="relative hidden md:flex items-center gap-8 text-gray-600 font-medium" id="nav-menu">
            <a href="./index.html" class="nav-item hover:text-emerald-600 pb-1 transition-colors">Feed</a>
            <a href="./profile.html" class="nav-item hover:text-emerald-600 pb-1 transition-colors">Profile</a>
            <div id="nav-indicator" class="absolute bottom-0 left-0 h-[2px] bg-emerald-600 transition-all duration-300 ease-out"></div>
        </div>
        
        <div class="flex items-center gap-3 ml-10">
            <a href="./login.html" id="btn-login" class="hidden bg-[#10B981] hover:bg-emerald-600 text-white px-5 py-2 rounded-full font-bold text-sm transition">
                เข้าสู่ระบบ
            </a>
            <a href="./profile.html" id="btn-profile" class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-700 shrink-0 hover:bg-gray-300 transition">
                <i class="fa-regular fa-user text-base"></i>
            </a>
            <button id="btn-logout" class="hidden text-sm text-red-500 hover:text-red-700 font-medium cursor-pointer">
                ออกจากระบบ
            </button>
        </div>
    </nav>

    <!-- Main Container ขนาดเท่า Profile -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-6 py-6 flex flex-col">
        <!-- ปุ่มย้อนกลับ -->
        <a title="toallcompanybtn" href="./allCompany.html" class="font-thai inline-flex items-center gap-2 text-black/50 hover:text-gray-700 font-normal text-lg transition-colors mb-3 shrink-0">
            <i class="fa-solid fa-chevron-left text-lg font-extrabold"></i>
            บริษัททั้งหมด
        </a>

        <section class="flex flex-col lg:flex-row w-full gap-6 items-start flex-1">
            
            <!-- ฝั่งซ้าย (Sidebar บริษัท) - ปรับขนาดเป็น lg:w-80 -->
            <aside class="w-full lg:w-80 shrink-0 space-y-4 font-thai">
                <div class="flex flex-col bg-white w-full rounded-3xl shadow-sm overflow-hidden border border-gray-100">
                    <img src="./img/บริษัท เก็ตออน เทคโนโลยี จำกัด.jpeg" alt="companyimage" class="w-full h-44 object-cover rounded-t-2xl"/>
                    <div class="p-4">
                        <h3 class="text-lg font-medium text-gray-900 leading-snug">บริษัท เก็ตออน เทคโนโลยี จำกัด</h3>
                        <span class="inline-block bg-[#10B981] text-white rounded-full px-4 py-1 font-medium text-xs mt-2 self-start">ฝึกงาน</span>
                    </div>
                </div>

                <div class="flex flex-col bg-white w-full rounded-3xl p-5 shadow-sm border border-gray-100 items-center space-y-2 text-center font-eng">
                    <h4 class="font-medium text-sm text-gray-500">Overall Rating</h4>
                    <h1 class="font-extrabold text-4xl text-gray-900">5</h1>
                    <div class="flex gap-1 text-[#10B981] text-xl">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <p class="text-xs text-gray-400">Based on 128 Reviews</p>
                </div>
            </aside>

            <!-- ฝั่งขวา (แบบฟอร์มแก้ไข) -->
            <div class="flex-1 min-w-0 flex flex-col h-full">
                <h2 class="text-xl font-eng font-bold text-gray-900 mb-3 shrink-0 font-eng">My Reviews</h2>

                <section class="flex-1 w-full bg-white rounded-3xl p-6 sm:p-8 border border-gray-100 shadow-sm">
                    <div class="flex justify-start items-center mb-6">
                        <span class="text-xs font-semibold text-gray-400">31 / 08 / 2026</span>
                    </div>
                    <div class="space-y-5 font-eng">
                    <!-- ตำแหน่งงาน -->
                    <div>
                        <label class="block text-lg font-semibold text-black/50 mb-2">Internship Position</label>
                        <input type="text" id="view-position" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm font-medium text-gray-700 cursor-not-allowed focus:outline-none" readonly />
                    </div>

                    <!-- ดาวคะแนน -->
                    <div>
                        <label class="block text-lg font-semibold text-black/50 mb-2">Rating Given</label>
                        <div class="flex flex-col items-center justify-center bg-gray-50 border border-gray-200 rounded-2xl p-4">
                            <h2 id="rating-display" class="font-extrabold text-4xl text-gray-900 mb-2">5</h2>
                            <div class="flex gap-2 text-2xl pointer-events-none">
                                <i class="fa-solid fa-star star-icon text-[#10B981]"></i>
                                <i class="fa-solid fa-star star-icon text-[#10B981]"></i>
                                <i class="fa-solid fa-star star-icon text-[#10B981]"></i>
                                <i class="fa-solid fa-star star-icon text-[#10B981]"></i>
                                <i class="fa-solid fa-star star-icon text-[#10B981]"></i>
                            </div>
                        </div>
                    </div>

                    <!-- รายละเอียดรีวิว -->
                    <div>
                        <label class="block text-lg font-semibold text-black/50 mb-2">Detailed Review</label>
                        <textarea id="view-review" rows="6" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-4 text-sm font-normal text-gray-700 cursor-not-allowed focus:outline-none leading-relaxed" readonly></textarea>
                    </div>
                </div>
                </section>
        </section>
    </main>

    <script type="module" src="./js/viewreview.js"></script>
</body>
</html>
