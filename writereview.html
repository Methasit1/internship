<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เขียนรีวิว - เด็กฝึกงาน.SE</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .font-eng { font-family: 'Inter', 'Sarabun', sans-serif; }
        .font-thai { font-family: 'Sarabun', 'Kanit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-thai bg-[#F3F5F7] h-screen flex flex-col font-thai text-gray-800 overflow-hidden">

    <!-- Header / Navbar -->
    <nav class="flex items-center justify-between px-6 py-3 bg-white border-b border-gray-100 sticky top-0 z-50 pr-9.75">
        <!-- โลโก้ (กดกลับหน้าหลัก) -->
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo" class="w-32">
        </a>
        
        <!-- เมนูตรงกลาง พร้อมเส้นใต้สไลด์ -->
        <div class="relative hidden md:flex items-center gap-9 tex t-lg font-normal" id="nav-menu">
            <!-- ใส่ href ให้ถูกต้อง -->
            <a href="./index.html" class="nav-item pb-1 transition-colors">Feed</a>
            <a href="./profile.html" class="nav-item hover:text-emerald-600 pb-1 transition-colors">Profile</a>
            
            <div id="nav-indicator" class="absolute bottom-0 left-0 h-[4px] bg-[#10B981] rounded-full transition-all duration-300 ease-out"></div>
        </div>
        
        <!-- Auth Container (สลับปุ่มตามสถานะล็อกอิน) -->
        <div class="flex items-center gap-4">
            <!-- ปุ่มเข้าสู่ระบบ -->
            <a href="./login.html" id="btn-login" class="bg-[#10B981] hover:bg-emerald-600 text-white px-5.5 py-3 rounded-full font-bold text-xs transition block">
                เข้าสู่ระบบ
            </a>
            
            <!-- ไอคอนโปรไฟล์ (ซ่อนไว้ก่อน จะแสดงเมื่อล็อกอินแล้วผ่าน TypeScript) -->
            <div>
                <a href="./profile.html" id="btn-profile" class="hidden ml-17.5 w-10 h-10 bg-gray-100 rounded-full items-center justify-center text-gray-500 hover:bg-gray-200 transition cursor-pointer">
                    <img id="profile-img" src="./img/profile.jpg" alt="profileimage" class="rounded-full w-10 h-10 object-cover shadow-sm"/>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-6 flex flex-col flex-1 w-full overflow-hidden">
        <a id="btn-back" title="toallcompanybtn" href="./companyreview.html" class="inline-flex items-center gap-2 text-black/50 hover:text-gray-700 font-normal text-lg transition-colors mb-3 shrink-0">
            <i class="fa-solid fa-chevron-left text-lg font-extrabold"></i>
            <span>หน้ารีวิวบริษัท</span>
        </a>

        <div class="flex-1 overflow-y-auto no-scrollbar flex justify-center items-start pt-2 pb-6">
            <div class="bg-white rounded-3xl max-w-2xl w-full p-8 md:p-10 shadow-sm border border-gray-100">
                <div class="mb-6">
                    <h1 class="text-3xl md:text-4xl font-extrabold font-eng text-gray-900 tracking-tight">Reviews</h1>
                    <span id="displayDate" class="text-xs font-semibold text-gray-400 font-eng tracking-wider mt-1 block"></span>
                </div>

                <form id="reviewForm" class="space-y-6">
                    <!-- Position Input -->
                    <div>
                        <label for="internshipPosition" class="block text-gray-500 font-medium text-sm md:text-base font-eng mb-2">
                            Internship Position
                        </label>
                        <input 
                            id="internshipPosition"
                            type="text"
                            required
                            placeholder="กรอกตำแหน่งฝึกงาน เช่น Frontend Developer"
                            class="w-full bg-[#EFEFEF]/70 focus:bg-white border border-transparent focus:border-emerald-500 rounded-2xl p-4 text-gray-800 font-medium outline-none transition-all duration-200 shadow-inner"/>
                    </div>

                    <!-- Overall Rating Input (ไม่มีทศนิยม) -->
                    <div class="py-2 text-center">
                        <label class="block text-gray-500 font-medium text-sm md:text-base font-eng mb-4 text-left">
                            Overall Rating
                        </label>
                        <div class="flex flex-col items-center justify-center space-y-2">
                            <!-- ตัวเลขเป็นจำนวนเต็ม 0-5 ไม่มีทศนิยม -->
                            <span id="ratingValueText" class="text-5xl md:text-6xl font-extrabold font-eng text-gray-900 tracking-tight">0</span>
                            <div class="flex gap-2 text-3xl md:text-4xl text-gray-300 pt-1" id="starContainer">
                                <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors" data-value="1"></i>
                                <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors" data-value="2"></i>
                                <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors" data-value="3"></i>
                                <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors" data-value="4"></i>
                                <i class="fa-solid fa-star cursor-pointer hover:text-emerald-400 transition-colors" data-value="5"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Detailed Review Input -->
                    <div>
                        <label for="detailedReview" class="block text-gray-500 font-medium text-sm md:text-base font-eng mb-2">
                            Detailed Review
                        </label>
                        <textarea 
                            id="detailedReview"
                            rows="4"
                            required
                            placeholder="กรอกรายละเอียดรีวิวการทำงาน สังคม สวัสดิการ..."
                            class="w-full bg-[#EFEFEF]/70 focus:bg-white border border-transparent focus:border-emerald-500 rounded-2xl p-4 text-gray-800 font-medium outline-none transition-all duration-200 resize-none shadow-inner"
                        ></textarea>
                    </div>

                    <!-- Actions -->
                    <div class="flex flex-row-reverse items-center gap-4 pt-4">
                        <button type="submit" class="font-thai text-sm font-semibold text-white bg-[#10B981] hover:bg-emerald-600 rounded-full px-8 py-3 transition-colors cursor-pointer shadow-sm">
                            บันทึก
                        </button>
                        <a id="btn-cancel" href="./companyreview.html" class="font-thai text-sm font-semibold text-gray-600 hover:text-red-500 rounded-full px-6 py-3 transition-colors inline-block">
                            ยกเลิก
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/writereview.js"></script>
</body>
</html>
