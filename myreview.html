<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เด็กฝึกงาน.SE</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        .font-eng { font-family: 'Sarabun', 'Inter', sans-serif; }
        .font-thai { font-family: 'Sarabun', 'Kanit', sans-serif; }
    </style>
</head>
<body class="font-thai bg-[#F3F5F7] min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="flex items-center justify-between px-6 py-3 bg-white border-b border-gray-100 sticky top-0 z-50">
        <!-- โลโก้ (กดกลับหน้าหลัก) -->
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo" class="w-32">
        </a>
        
        <!-- เมนูตรงกลาง พร้อมเส้นใต้สไลด์ -->
        <div class="relative hidden md:flex items-center gap-9 tex t-lg font-normal" id="nav-menu">
            <!-- ใส่ href ให้ถูกต้อง -->
            <a href="./index.html" class="nav-item pb-1 transition-colors">Feed</a>
            <a href="./profile.html" class="nav-item hover:text-emerald-600 pb-1 transition-colors">Profile</a>
            
            <div id="nav-indicator" class="absolute bottom-0 left-0 h-[4px] bg-[#10B981] rounded-full transition-all duration-300 ease-out"></div>
        </div>
        
        <!-- Auth Container (สลับปุ่มตามสถานะล็อกอิน) -->
        <div class="flex items-center gap-4">
            <!-- ปุ่มเข้าสู่ระบบ -->
            <a href="./login.html" id="btn-login" class="bg-[#10B981] hover:bg-emerald-600 text-white px-5.5 py-3 rounded-full font-bold text-xs transition block">
                เข้าสู่ระบบ
            </a>
            
            <!-- ไอคอนโปรไฟล์ (ซ่อนไว้ก่อน จะแสดงเมื่อล็อกอินแล้วผ่าน TypeScript) -->
            <div>
                <a href="./profile.html" id="btn-profile" class="hidden ml-17.5 w-10 h-10 bg-gray-100 rounded-full items-center justify-center text-gray-500 hover:bg-gray-200 transition cursor-pointer">
                    <img id="profile-img" src="./img/profile.jpg" alt="profileimage" class="rounded-full w-10 h-10 object-cover shadow-sm"/>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container ขนาดเท่า Profile -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-6 py-6 flex flex-col">
        <!-- ปุ่มย้อนกลับ -->
        <a title="toallcompanybtn" href="./profile.html" class="font-thai inline-flex items-center gap-2 text-black/50 hover:text-gray-700 font-normal text-lg transition-colors mb-3 shrink-0">
            <i class="fa-solid fa-chevron-left text-lg font-extrabold"></i>
            ย้อนกลับ
        </a>

        <section class="flex flex-col lg:flex-row w-full gap-6 items-start flex-1">
            
            <!-- ฝั่งซ้าย (Sidebar บริษัท) - ปรับขนาดเป็น lg:w-80 -->
            <aside class="w-full lg:w-80 shrink-0 space-y-4 font-thai">
                <div class="flex flex-col bg-white w-full rounded-3xl shadow-sm overflow-hidden border border-gray-100">
                    <img id="company-img" src="./img/บริษัท เก็ตออน เทคโนโลยี จำกัด.jpeg" alt="companyimage" class="w-full h-44 object-cover rounded-t-2xl"/>
                    <div class="p-4">
                        <h3 id="company-name" class="text-lg font-medium text-gray-900 leading-snug">บริษัท เก็ตออน เทคโนโลยี จำกัด</h3>
                        <span class="inline-block bg-[#10B981] text-white rounded-full px-4 py-1 font-medium text-xs mt-2 self-start">ฝึกงาน</span>
                    </div>
                </div>

                <div class="flex flex-col bg-white w-full rounded-3xl p-5 shadow-sm border border-gray-100 items-center space-y-2 text-center font-eng">
                    <h4 class="font-medium text-sm text-gray-500">Overall Rating</h4>
                    <h1 id="company-rating" class="font-extrabold text-4xl text-gray-900">5</h1>
                    <div id="company-stars" class="flex gap-1 text-[#10B981] text-xl">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <p id="company-review-count" class="text-xs text-gray-400">Based on 128 Reviews</p>
                </div>
            </aside>

            <!-- ฝั่งขวา (แบบฟอร์มแก้ไข) -->
            <div class="flex-1 min-w-0 flex flex-col h-full font-thai">
                <h2 class="text-xl font-eng font-bold text-gray-900 mb-3 shrink-0 font-eng">My Reviews</h2>

                <section class="flex-1 w-full bg-white rounded-3xl p-6 sm:p-8 border border-gray-100 shadow-sm">
                    <div class="flex justify-start items-center mb-6">
                        <span id="review-date" class="text-xs font-semibold text-gray-400">31 / 08 / 2026</span>
                    </div>

                    <form id="edit-review-form" class="space-y-5 font-eng">
                        <!-- ตำแหน่งงาน -->
                        <div>
                            <label for="input-position" class="block text-lg font-semibold text-black/50 mb-2">Internship Position</label>
                            <input type="text" id="input-position" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm font-medium text-gray-800 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" required />
                        </div>

                        <!-- ให้ดาว / คะแนน -->
                        <div>
                            <label class="block text-lg font-semibold text-black/50 mb-2">Overall Rating</label>
                            <div class="flex flex-col items-center bg-gray-50 border border-gray-200 rounded-2xl justify-center p-4">
                                <h2 id="rating-display" class="font-extrabold text-4xl text-gray-900 mb-2">5</h2>
                                
                                <!-- ปุ่มดาว interactive -->
                                <div id="star-container" class="flex gap-2 text-2xl cursor-pointer">
                                    <i class="fa-solid fa-star star-btn text-[#10B981] transition-colors" data-value="1"></i>
                                    <i class="fa-solid fa-star star-btn text-[#10B981] transition-colors" data-value="2"></i>
                                    <i class="fa-solid fa-star star-btn text-[#10B981] transition-colors" data-value="3"></i>
                                    <i class="fa-solid fa-star star-btn text-[#10B981] transition-colors" data-value="4"></i>
                                    <i class="fa-solid fa-star star-btn text-[#10B981] transition-colors" data-value="5"></i>
                                </div>
                                <!-- Input ซ่อนไว้เก็บค่า score -->
                                <input type="hidden" id="input-rating" value="5">
                            </div>
                        </div>

                        <!-- รายละเอียดรีวิว -->
                        <div>
                            <label for="input-review" class="block text-lg font-semibold text-black/50 mb-2">Detailed Review</label>
                            <textarea id="input-review" rows="5" 
                            class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-4 text-sm font-normal text-gray-700 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition leading-relaxed" required></textarea>
                        </div>

                        <!-- ปุ่มการทำงาน -->
                        <div class="flex items-center justify-end gap-3 pt-3 border-t border-gray-100 font-thai">
                            <a href="./profile.html" class="text-sm font-semibold text-gray-500 hover:text-red-500 px-5 py-2.5 rounded-full transition">
                                ยกเลิก
                            </a>
                            <button type="submit" class="text-sm font-semibold text-white bg-[#10B981] hover:bg-emerald-600 px-6 py-2.5 rounded-full shadow-sm transition">
                                บันทึก
                            </button>
                        </div>
                    </form>

                </section>
            </div>
        </section>
    </main>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/myreview.js"></script>
</body>
</html>
