<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company </title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        .font-eng { font-family: 'Sarabun', 'Inter', sans-serif; }
        .font-thai { font-family: 'Sarabun', 'Kanit', sans-serif; }
    </style>
</head>
<body class="font-thai">

    <!-- Navbar -->
    <nav class="flex items-center justify-between px-6 py-3 bg-white border-b border-gray-100 sticky top-0 z-50">
        <!-- โลโก้ (กดกลับหน้าหลัก) -->
        <a href="./index.html">
            <img src="./img/logo.png" alt="Logo" class="w-32">
        </a>
        
        <!-- เมนูตรงกลาง พร้อมเส้นใต้สไลด์ -->
        <div class="relative hidden md:flex items-center gap-9 tex t-lg font-normal" id="nav-menu">
            <!-- ใส่ href ให้ถูกต้อง -->
            <a href="./index.html" class="nav-item pb-1 transition-colors">Feed</a>
            <a href="./profile.html" class="nav-item hover:text-emerald-600 pb-1 transition-colors">Profile</a>
            
            <div id="nav-indicator" class="absolute bottom-0 left-0 h-[4px] bg-[#10B981] rounded-full transition-all duration-300 ease-out"></div>
        </div>
        
        <!-- Auth Container (สลับปุ่มตามสถานะล็อกอิน) -->
        <div class="flex items-center gap-4">
            <!-- ปุ่มเข้าสู่ระบบ -->
            <a href="./login.html" id="btn-login" class="bg-[#10B981] hover:bg-emerald-600 text-white px-5.5 py-3 rounded-full font-bold text-xs transition block">
                เข้าสู่ระบบ
            </a>
            
            <!-- ไอคอนโปรไฟล์ (ซ่อนไว้ก่อน จะแสดงเมื่อล็อกอินแล้วผ่าน TypeScript) -->
            <div>
                <a href="./profile.html" id="btn-profile" class="hidden ml-17.5 w-10 h-10 bg-gray-100 rounded-full items-center justify-center text-gray-500 hover:bg-gray-200 transition cursor-pointer">
                    <img id="profile-img" src="./img/profile.jpg" alt="profileimage" class="rounded-full w-10 h-10 object-cover shadow-sm"/>
                </a>
            </div>
        </div>
    </nav>

    <main class="bg-[#F3F5F7] mx-auto px-10 py-12 min-h-screen">
        <h1 class="max-w-7xl mx-auto text-4xl md:text-3xl font-medium mb-10">ฝึกงาน 3000 ตำแหน่ง</h1>
        
        <div id="all-companies-grid" class="max-w-7xl mx-auto group grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>
    
    <!-- Footer -->
    <footer class="bg-[#A6F2D1]/35 p-8">
        <div class=" rounded-[2.5rem] md:p-10 flex flex-col md:flex-row justify-between items-start gap-8 relative overflow-hidden shadow-2xl">
            
            <div class="max-w-7xl flex flex-col md:flex-row justify-between items-start gap-8">
                <div class="max-w-md">
                    <img src="./img/logo.png" alt="Logo" class="w-32 mb-4">
                    <p class="text-gray-600">เด็กฝึกงาน.com เว็บหาที่ฝึกงาน และ แพลตฟอร์มศูนย์กลางการแลกเปลี่ยนประสบการณ์ฝึกงานจริงจากรุ่นพี่สู่รุ่นน้อง เพื่อการตัดสินใจเลือกสถานที่ฝึกงานอย่างแม่นยำและตรงเป้าหมาย</p>
                </div>
            </div>

            <div class="flex-shrink-0">
                <div class="flex items-center justify-center">
                    <img src="./img/โลโก้สาขาSE 3.png" alt="SE Logo" class="w-48 h-48 object-cover">
                </div>
            </div>

        </div>
    </footer>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
